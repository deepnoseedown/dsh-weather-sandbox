# dsh-weather-sandbox bundle patch.
# 一个插件行：Host 半边只负责 /dsh-weather-sandbox 下的静态文件，
# 浏览器半边由 package.json 的 dsh.client 声明自动加载。
#
# ⚠ name 必须是【可被 import 的模块名】（= package.json 的 name），不是给人看的显示名。
#   写成中文会让加载器去 import '天气演化沙盒'，找不到模块，整个插件挂载失败。
#   界面上的中文名走两处：
#     · package.json 的 displayName
#     · client/index.js 里的 copy.title（面板标题）
- insert:
    - id: dsh-weather-sandbox
      name: 'dsh-weather-sandbox'
